name: Build Windows Control Center

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out ReShade add-on headers
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: main
          path: deps/reshade
          persist-credentials: false

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build ReShade DXIL bridge add-on
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/addons | Out-Null
          cl.exe /nologo /std:c++20 /O2 /MT /EHsc /LD /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Ideps/reshade/include addons/src/fsr4_gfx803_addon.cpp /link /OUT:artifacts/addons/FSR4-GFX803.addon64 Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file application
        shell: pwsh
        run: dotnet publish app/Fsr4Gfx803.ControlCenter/Fsr4Gfx803.ControlCenter.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Include GFX803 diagnostic scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/publish/tools/windows | Out-Null
          Copy-Item tools/windows/* artifacts/publish/tools/windows/ -Recurse -Force
          New-Item -ItemType Directory -Force artifacts/publish/addons | Out-Null
          Copy-Item artifacts/addons/FSR4-GFX803.addon64 artifacts/publish/addons/FSR4-GFX803.addon64 -Force
          Set-Content artifacts/publish/BUILD.txt "FSR4 GFX803 Control Center | Windows x64 | .NET 8 self-contained | $env:GITHUB_SHA"

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/FSR4-GFX803-ControlCenter-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSR4-GFX803-ControlCenter-win-x64
          path: artifacts/FSR4-GFX803-ControlCenter-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FSR4-GFX803-ControlCenter-win-x64.zip
