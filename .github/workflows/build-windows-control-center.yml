name: Build Windows Control Center

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out ReShade add-on headers
        uses: actions/checkout@v4
        with:
          repository: crosire/reshade
          ref: 7bf9de8b33bcc76c3177007e65d73c72dd0f34c0
          path: deps/reshade
          persist-credentials: false

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download pinned DirectX Shader Compiler toolchain
        shell: pwsh
        run: |
          $archive = "deps/dxc_2026_09_29.zip"
          New-Item -ItemType Directory -Force deps/dxc | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip" -OutFile $archive
          $expected = "ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "DXC archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath deps/dxc -Force
          $dxc = Get-ChildItem deps/dxc -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $compiler = Get-ChildItem deps/dxc -Filter dxcompiler.dll -Recurse | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $validator = Get-ChildItem deps/dxc -Filter dxil.dll -Recurse | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $header = Get-ChildItem deps/dxc -Filter dxcapi.h -Recurse | Select-Object -First 1
          if (!$dxc -or !$compiler -or !$validator -or !$header) { throw "The pinned DXC package is missing a required compiler, validator or header file." }
          "DXC_EXE=$($dxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DXC_DLL=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DXIL_DLL=$($validator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DXC_INCLUDE=$($header.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/DirectXShaderCompiler/v1.9.2609/LICENSE.TXT" -OutFile deps/dxc/LICENSE.TXT

      - name: Build Windows DXIL assembler and validator helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          cl.exe /nologo /std:c++17 /O2 /MT /EHsc /I"$env:DXC_INCLUDE" tools/windows/dxil/dxilasm_win.cpp /link /OUT:artifacts/tools/dxilasm-win.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native DXIL dot4 transformer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools | Out-Null
          cl.exe /nologo /std:c++17 /O2 /MT /EHsc tools/windows/dxil/dxil-dot4-rewrite.cpp /link /OUT:artifacts/tools/dxil-dot4-rewrite.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test GFX803 DXIL expansion and DXC validation
        shell: pwsh
        run: |
          & tools/windows/dxil/tests/run-dxil-transform-selftest.ps1 -DxcPath $env:DXC_EXE -DxCompilerPath $env:DXC_DLL -AssemblerPath artifacts/tools/dxilasm-win.exe -TransformerPath artifacts/tools/dxil-dot4-rewrite.exe -WorkDirectory artifacts/dxil-selftest

      - name: Build ReShade DXIL bridge add-on
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/addons | Out-Null
          cl.exe /nologo /std:c++20 /O2 /MT /EHsc /LD /DWIN32_LEAN_AND_MEAN /DNOMINMAX /Ideps/reshade/include addons/src/fsr4_gfx803_addon.cpp /link /OUT:artifacts/addons/FSR4-GFX803.addon64 Psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file application
        shell: pwsh
        run: dotnet publish app/Fsr4Gfx803.ControlCenter/Fsr4Gfx803.ControlCenter.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Include GFX803 diagnostic scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/publish/tools/windows | Out-Null
          Copy-Item tools/windows/* artifacts/publish/tools/windows/ -Recurse -Force
          New-Item -ItemType Directory -Force artifacts/publish/addons/src | Out-Null
          Copy-Item artifacts/addons/FSR4-GFX803.addon64 artifacts/publish/addons/FSR4-GFX803.addon64 -Force
          Copy-Item addons/src/fsr4_gfx803_addon.cpp artifacts/publish/addons/src/fsr4_gfx803_addon.cpp -Force
          Copy-Item addons/LICENSE artifacts/publish/addons/LICENSE -Force
          Copy-Item addons/LICENSE artifacts/publish/LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/publish/THIRD_PARTY_NOTICES.md -Force
          New-Item -ItemType Directory -Force artifacts/publish/tools/dxc | Out-Null
          Copy-Item $env:DXC_EXE artifacts/publish/tools/dxc/dxc.exe -Force
          Copy-Item $env:DXC_DLL artifacts/publish/tools/dxc/dxcompiler.dll -Force
          Copy-Item $env:DXIL_DLL artifacts/publish/tools/dxc/dxil.dll -Force
          Copy-Item artifacts/tools/dxilasm-win.exe artifacts/publish/tools/dxc/dxilasm-win.exe -Force
          Copy-Item artifacts/tools/dxil-dot4-rewrite.exe artifacts/publish/tools/dxc/dxil-dot4-rewrite.exe -Force
          Copy-Item deps/dxc/LICENSE.TXT artifacts/publish/tools/dxc/LICENSE.TXT -Force
          if (!(Test-Path artifacts/publish/tools/windows/install-reshade-full-addon.ps1)) { throw "The official ReShade setup helper was not included in the portable package." }
          @'
FSR4 GFX803 Control Center - portable package

Included:
- Self-contained Windows x64 Control Center (no separate .NET runtime)
- FSR4-GFX803 ReShade D3D12 add-on
- DXC assembler/compiler and DXIL validator DLLs
- Native DXIL rewrite and assembly helpers
- PowerShell setup and diagnostics scripts

First setup:
1. Extract this ZIP.
2. Run FSR4-GFX803-ControlCenter.exe.
3. Open Game bridge and click "Download ReShade 6.8.0 (full add-on support)".
4. The helper downloads the official ReShade installer from reshade.me and launches it.
5. Select the game executable and DirectX 12 in ReShade setup, then return to the Control Center and install the bridge.

ReShade itself is not included because the official ReShade website says not to redistribute its binaries.
AMD Radeon GPU Analyzer is optional and is only needed for the separate ISA diagnostic probe.
The DXIL rewrite is experimental; this package does not include an RX 580-validated shader pack.
'@ | Set-Content artifacts/publish/PACKAGE-README.txt -Encoding utf8
          Set-Content artifacts/publish/BUILD.txt "FSR4 GFX803 Control Center | Windows x64 | .NET 8 self-contained | $env:GITHUB_SHA"

      - name: Upload DXIL self-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FSR4-GFX803-DXIL-selftest
          path: artifacts/dxil-selftest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/FSR4-GFX803-ControlCenter-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSR4-GFX803-ControlCenter-win-x64
          path: artifacts/FSR4-GFX803-ControlCenter-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FSR4-GFX803-ControlCenter-win-x64.zip
